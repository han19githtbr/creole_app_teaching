t-size="34" fill="#fff">F</text><rect x="1030" y="6" width="54" height="54" rx="8" fill="#14b8a6" stroke="rgba(0,0,0,.25)" stroke-width="2"/><text x="1057" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="34" fill="#fff">G</text>
